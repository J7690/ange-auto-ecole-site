[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Les images, polices et icones changent rarement : cache long
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le service worker ne doit jamais etre servi depuis le cache,
# sinon les mises a jour du site n'arrivent pas aux visiteurs.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# NOTE : pas de redirection attrape-tout ici.
# Un "/* -> /index.html 200" renverrait la page d'accueil pour toute URL
# inexistante, ce que Google interprete comme du contenu duplique.
# Netlify sert les vraies pages et affiche une 404 pour le reste.
